<body>
  <header class="titlebar">
    <div class="app-name">全屏找图 <small>JADE x86</small></div>
    <div class="titlebar-right">
      <button id="topmostBtn" class="ctrl-btn" onclick="toggleTopmost()">置顶</button>
      <button class="ctrl-btn" onclick="minimizeWindow()">−</button>
      <button class="ctrl-btn close" onclick="closeWindow()">×</button>
    </div>
  </header>
  <main>
    <section class="panel parameters">
      <div class="parameter-grid">
        <label>相似度阈值<input id="threshold" value="0.95"></label>
        <label>检测间隔（秒）<input id="interval" value="1.0"></label>
        <label>冷却（秒）<input id="cooldown" value="15"></label>
        <label>离开判定（分钟）<input id="away" value="60"></label>
      </div>
    </section>
    <section class="panel target-panel">
      <div class="target-row"><label class="hwnd-field">目标 HWND<input id="hwnd" placeholder="默认：UnrealWindow"></label><button id="pickBtn" title="按住并拖到目标窗口，松开后自动获取 HWND">🎯 拖住寻找</button><label class="time-field">强制检测时间<div class="time-inputs"><input id="forceStart" placeholder="10:00"><span>至</span><input id="forceEnd" placeholder="14:00"></div></label><button onclick="save()">保存</button></div>
    </section>
    <section class="panel options-panel">
      <div class="check-row"><label><input id="click" type="checkbox">点击目标</label><label><input id="flash" type="checkbox">窗口闪烁</label><label><input id="email" type="checkbox">邮件提醒</label><label><input id="squeeze" type="checkbox">挤线模式</label><button onclick="act('flash_window')">立即闪烁</button></div>
    </section>
    <section class="panel groups-panel">
      <div class="section-head"><span></span><button onclick="act('refresh_groups')">刷新图片组</button></div>
      <div id="groups" class="group-checkboxes"><span class="loading">正在加载角色...</span></div>
    </section>
    <section class="panel schemes-panel">
      <div class="section-head"><span class="hint">点击数字选择方案，点击“测”单独测试</span></div>
      <div id="schemes" class="scheme-row"></div>
    </section>
    <section class="button-row">
      <button id="runBtn" class="primary" onclick="toggleDetection()">启动检测</button>
      <button onclick="act('test')">测试</button>
      <button onclick="act('keysim')">按键模拟</button>
      <button id="stopBtn" onclick="stopDetection()">停止检测</button>
      <button onclick="act('open_dir')">查图片目录</button>
      <button onclick="act('clear_logs')">清空日志</button>
    </section>
